name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest -q --cov=neural_harness --cov-report=term-missing
      - name: Run harness site check (demo + adapters)
        run: |
          python -m neural_harness validate demo --out harness_reports
          python -m neural_harness site --root . --out harness_reports
      - name: Verify human voice in the demo report
        run: |
          python -m neural_harness voice --file harness_reports/demo.validation.md