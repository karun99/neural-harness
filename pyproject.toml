[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-harness"
version = "1.0.0"
description = "A validation harness engine for neural projects: information handling, neural synthesis, and fused data-integration accuracy, with human-voice reporting."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Karun Karun", email = "karun@karun.online"}]
keywords = [
    "validation", "harness", "neural", "evaluation",
    "data-integration", "llm", "quality", "human-voice",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nh = "neural_harness.cli:main"

[project.urls]
Homepage = "https://github.com/karun99/neural-harness"
Repository = "https://github.com/karun99/neural-harness"
JOSS = "https://github.com/karun99/neural-harness/tree/main/paper"

[tool.setuptools]
packages = ["neural_harness", "neural_harness.projects"]

[tool.pytest.ini_options]
testpaths = ["tests"]